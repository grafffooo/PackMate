[workspace]
resolver = "2"
members = ["crates/dieline-core", "crates/dieline-wasm"]
# The Tauri shell is its own workspace (it pulls in heavy native deps).
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/grafffooo/PackMate"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
