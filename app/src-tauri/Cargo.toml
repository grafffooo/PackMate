[package]
name = "packmate"
version = "0.1.0"
description = "PackMate — parametric packaging dielines"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "packmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
